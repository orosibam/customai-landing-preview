name: 파이프라인 점검

# 첫 영상까지 가는 경로에서 막히는 지점만 빠르게 때린다.
# 개발 컨테이너는 대상 사이트 대부분이 egress 정책에 막혀 있어 여기서만 확인된다.
#
# 일일 생성 워크플로우와 분리한 이유는 비용이다. 이 점검은 **LLM 을 부르지 않고**
# 영상도 렌더하지 않는다. 다만 타입캐스트는 한 문장을 실제로 합성하므로
# 크레딧이 아주 조금 든다 — 폴링이 맞는지는 실제로 불러봐야만 알 수 있어서 넣었다.
#
# 브랜치에 푸시하면 자동으로 돈다. workflow_dispatch 는 기본 브랜치에 있는 워크플로우만
# 허용해서, 작업 브랜치에서 결과를 보려면 push 트리거가 필요하다.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'shorts-factory/scrapers-py/**'
      - 'shorts-factory/src/lib/scrapers/**'
      - 'shorts-factory/src/probe.ts'
      - '.github/workflows/shorts-probe.yml'
  workflow_dispatch:

concurrency:
  group: shorts-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shorts-factory/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        working-directory: shorts-factory
        run: |
          npm ci
          pip install -r scrapers-py/requirements.txt

      # 네트워크 없이도 도는 파싱 테스트. 여기가 깨지면 아래는 볼 필요가 없다.
      - name: SSR 파싱 테스트
        working-directory: shorts-factory
        run: python3 scrapers-py/test_cn_media.py

      # 샤오홍슈·1688 은 HTTP 만 쓴다. 수확 재고가 없으면 [재고없음] 으로 찍히고
      # 차단으로 세지 않는다 — 그건 코드 고장이 아니라 사람이 로그인할 차례라는 뜻이다.
      - name: 샤오홍슈 · 1688 접근 점검
        working-directory: shorts-factory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/probe.ts cn-bridge xiaohongshu 1688

      # 위가 실패했을 때 "어디가" 막혔는지 본다. 1688 검색 진입로를 하나씩 때려보고
      # 상태·크기·찾은 상품 수만 낸다 (값은 찍지 않아 로그를 그대로 공유해도 안전하다).
      # 추측으로 진입로를 고르지 않으려고 만든 계측기다.
      # 첫 영상까지 가는 경로에서 아직 한 번도 안 돌려본 둘.
      # 타입캐스트는 한 문장만 합성한다(크레딧 소모 최소). 틱톡은 브라우저가 필요하다.
      - name: Playwright 브라우저 설치
        if: always()
        working-directory: shorts-factory
        run: npx playwright install --with-deps chromium

      - name: 렌더 · 나레이션 · 틱톡 점검
        if: always()
        working-directory: shorts-factory
        env:
          TYPECAST_API_TOKEN: ${{ secrets.TYPECAST_API_TOKEN }}
        run: npx tsx src/probe.ts ffmpeg typecast tiktok

      - name: 1688 진입로 계측
        if: always()
        working-directory: shorts-factory
        run: python3 scrapers-py/cn_media.py ali-probe --keyword 洗车液
