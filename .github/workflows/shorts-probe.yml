name: 파이프라인 점검

# 첫 영상까지 가는 경로에서 막히는 지점만 빠르게 때린다.
# 개발 컨테이너는 대상 사이트 대부분이 egress 정책에 막혀 있어 여기서만 확인된다.
#
# 일일 생성 워크플로우와 분리한 이유는 비용이다. 이 점검은 **LLM 을 부르지 않고**
# 영상도 렌더하지 않는다. 다만 타입캐스트는 한 문장을 실제로 합성하므로
# 크레딧이 아주 조금 든다 — 폴링이 맞는지는 실제로 불러봐야만 알 수 있어서 넣었다.
#
# 브랜치에 푸시하면 자동으로 돈다. workflow_dispatch 는 기본 브랜치에 있는 워크플로우만
# 허용해서, 작업 브랜치에서 결과를 보려면 push 트리거가 필요하다.
on:
  push:
    branches:
      - 'claude/**'
    # 경로를 하나씩 적었더니 probe-typecast.ts 를 고쳐 푸시해도 점검이 안 돌았다.
    # 빠뜨린 걸 모른 채 결과를 기다리게 된다. 점검이 보는 것은 전부 넣는다.
    paths:
      - 'shorts-factory/scrapers-py/**'
      - 'shorts-factory/src/lib/**'
      - 'shorts-factory/src/probe*.ts'
      - 'shorts-factory/src/config.ts'
      - 'shorts-factory/package*.json'
      - '.github/workflows/shorts-probe.yml'
  workflow_dispatch:

concurrency:
  group: shorts-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shorts-factory/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        working-directory: shorts-factory
        run: |
          npm ci
          pip install -r scrapers-py/requirements.txt

      # 네트워크 없이도 도는 파싱 테스트. 여기가 깨지면 아래는 볼 필요가 없다.
      - name: SSR 파싱 테스트
        working-directory: shorts-factory
        run: python3 scrapers-py/test_cn_media.py

      # 샤오홍슈·1688 은 HTTP 만 쓴다. 수확 재고가 없으면 [재고없음] 으로 찍히고
      # 차단으로 세지 않는다 — 그건 코드 고장이 아니라 사람이 로그인할 차례라는 뜻이다.
      - name: 샤오홍슈 · 1688 접근 점검
        working-directory: shorts-factory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/probe.ts cn-bridge xiaohongshu 1688

      # 위가 실패했을 때 "어디가" 막혔는지 본다. 1688 검색 진입로를 하나씩 때려보고
      # 상태·크기·찾은 상품 수만 낸다 (값은 찍지 않아 로그를 그대로 공유해도 안전하다).
      # 추측으로 진입로를 고르지 않으려고 만든 계측기다.
      # ffmpeg 는 러너에 없다(실측). 렌더 점검 전에 깔아둔다.
      - name: ffmpeg 설치
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # 첫 영상까지 가는 경로에서 아직 한 번도 안 돌려본 둘.
      # 타입캐스트는 한 문장만 합성한다(크레딧 소모 최소). 틱톡은 브라우저가 필요하다.
      - name: Playwright 브라우저 설치
        if: always()
        working-directory: shorts-factory
        run: npx playwright install --with-deps chromium

      - name: 렌더 · 나레이션 · 틱톡 점검
        if: always()
        working-directory: shorts-factory
        env:
          TYPECAST_API_TOKEN: ${{ secrets.TYPECAST_API_TOKEN }}
        run: npx tsx src/probe.ts ffmpeg typecast tiktok

      # 타입캐스트가 403 을 준다. 값은 감추고 응답 구조만 찍어 원인을 좁힌다 —
      # 출력에 토큰이 섞이지 않으므로 그대로 공유해도 안전하다.
      - name: 타입캐스트 응답 구조 확인
        if: always()
        working-directory: shorts-factory
        env:
          TYPECAST_API_TOKEN: ${{ secrets.TYPECAST_API_TOKEN }}
        run: npx tsx src/probe-typecast.ts

      - name: 1688 진입로 계측
        if: always()
        working-directory: shorts-factory
        run: python3 scrapers-py/cn_media.py ali-probe --keyword 洗车液

      # 지금 첫 영상을 막고 있는 유일한 질문: 검색을 사람 로그인 없이 뚫을 수 있는가.
      # 앞선 측정은 전부 생 HTTP 라서 "JS 가 나중에 받아온다" 까지만 알고 끝냈다.
      # 진짜 브라우저로 열어 JS 를 돌려보는 건 여기가 처음이다.
      - name: 검색 로그인 필요 여부 (브라우저)
        if: always()
        working-directory: shorts-factory
        run: npx tsx src/probe-search.ts 洗车液

      # 중국 내수 플랫폼 검색이 데이터센터 IP 에서 전부 벽이라는 게 실측으로 나왔다
      # (샤오홍슈 로그인 벽 / 1688 슬라이더 캡차 / m.1688 로그인). 알리익스프레스는
      # 해외向 이라 사정이 다를 수 있다. 검색·상세·영상유무를 한 번에 잰다.
      - name: 알리익스프레스 소재 공급 가능 여부
        if: always()
        working-directory: shorts-factory
        run: npx tsx src/probe-ali.ts "car wash snow foam"

      # 벤치마킹 대상을 추측하지 않고 잰다. 개발 컨테이너는 틱톡·인스타·유튜브가
      # 전부 egress 에 막혀 있어서 여기서만 숫자를 얻을 수 있다.
      - name: 홈스토리 계정 계측
        if: always()
        working-directory: shorts-factory
        run: npx tsx src/probe-benchmark.ts homestory.official

      # 베낄 것은 제품이 아니라 파는 방식이다 — 첫 문장 문형, 말투, 소구 순서, CTA 위치.
      # 틱톡·인스타는 로그인 벽이라 게시물을 못 본다. 유튜브 쇼츠는 공개이고
      # 자동 자막이 붙어서 나레이션 전문을 타임스탬프째로 받을 수 있다.
      # 같은 이름의 채널이 여럿이라 후보를 둘 다 열어 채널 소개로 판별한다.
      - name: 홈스토리 나레이션 (유튜브 자막)
        if: always()
        working-directory: shorts-factory
        run: |
          for h in @Homestory_official @homestorytv; do
            echo "########## $h ##########"
            python3 scrapers-py/voice_probe.py "$h" --limit 6 || echo "  ($h 실패 — 다음 후보로)"
          done

      - name: 계측 원본 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: shorts-factory/.probe/
          if-no-files-found: ignore
