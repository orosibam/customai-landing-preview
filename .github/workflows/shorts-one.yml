name: 쇼츠 한 편 제작

# 하루치 8편을 돌리기 전에 **한 편이 끝까지 가는지** 본다.
# 8개를 동시에 돌리면 어느 단계가 왜 막혔는지 로그가 섞여 안 보이고,
# 막히는 곳이 있으면 LLM 비용을 8배로 태우고 나서 알게 된다.
#
# 배포는 하지 않는다. 승인 게이트는 그대로다 — 완성본을 아티팩트로 내려받아 눈으로 본다.
on:
  push:
    branches:
      - 'claude/**'
    # 경로를 좁게 적었다가 lib/ 만 고친 푸시에서 이 워크플로우가 안 돌았다.
    # 오지도 않을 결과를 기다리게 된다. shorts-probe 에서 이미 같은 실수를 했는데
    # 새 워크플로우에서 반복했다 — 제작이 건드리는 것은 전부 넣는다.
    paths:
      - 'shorts-factory/src/**'
      - 'shorts-factory/scrapers-py/**'
      - 'shorts-factory/package*.json'
      - '.github/workflows/shorts-one.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: '채널 키 (tt-living / tt-kitchen / naver-living / yt-gadget)'
        default: 'yt-gadget'

concurrency:
  # 겹쳐 돌면 같은 상품을 두 번 집고 LLM 비용만 두 배가 된다.
  group: shorts-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shorts-factory/package-lock.json

      # ubuntu-latest 에 ffmpeg 는 없다(실측: spawn ffmpeg ENOENT).
      - name: ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 의존성 설치
        working-directory: shorts-factory
        run: npm ci

      # 발굴(인스타)·가용성(다나와)·소재(알리) 셋 다 브라우저를 쓴다.
      - name: Playwright 브라우저 설치
        working-directory: shorts-factory
        run: npx playwright install --with-deps chromium

      # 네트워크 없이 도는 것부터. 여기서 깨지면 아래를 볼 필요가 없고 LLM 비용도 안 쓴다.
      - name: 발음 정규화 테스트
        working-directory: shorts-factory
        run: npx tsx src/lib/korean.test.ts

      # evaluate 안에 함수를 선언하면 브라우저에 __name 이 없어 터진다(tsx/esbuild).
      # 이것 때문에 인스타 릴스 읽기가 전부 실패해 발굴이 0건이 됐던 적이 있다.
      # 네트워크를 안 쓰고 몇 초면 끝나므로 LLM 비용을 쓰기 전에 여기서 확인한다.
      - name: 브라우저 evaluate 심 확인
        working-directory: shorts-factory
        run: npx tsx src/lib/browser.shim.test.ts

      - name: 한 편 제작
        working-directory: shorts-factory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPECAST_API_TOKEN: ${{ secrets.TYPECAST_API_TOKEN }}
          # 인스타 발굴은 비로그인이 더 잘 된다(실측). 세션은 경로가 바뀔 때를 위한 폴백이다.
          INSTAGRAM_STORAGE_STATE: ${{ secrets.INSTAGRAM_STORAGE_STATE }}
          MIRROR_FOOTAGE: ${{ vars.MIRROR_FOOTAGE }}
          ZOOM_FOOTAGE: ${{ vars.ZOOM_FOOTAGE }}
        run: npx tsx src/stage.ts one --channel=${{ inputs.channel || 'yt-gadget' }}

      # 완성본과 중간 산출물을 받아 눈으로 본다. 실패해도 올린다 —
      # 어디까지 갔는지가 다음 수를 정한다.
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-one-${{ github.run_id }}
          path: |
            shorts-factory/*.mp4
            shorts-factory/out/**
            shorts-factory/*.log
          if-no-files-found: ignore
          retention-days: 14
